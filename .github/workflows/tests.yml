name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - run: pip install pytest==9.1.1
      - run: python -m pytest -v

      # Install it the way the README says, run the README's walkthrough with
      # the installed command, then uninstall and check it's gone.
      - name: Install with pipx
        run: |
          pip install pipx==1.17.14
          python -m pipx install --python "$(python -c "import sys; print(sys.executable)")" .
          echo "$(python -m pipx environment --value PIPX_BIN_DIR)" >> "$GITHUB_PATH"
      - name: README walkthrough
        working-directory: examples
        run: |
          standin --version
          standin keygen ../walk.key
          standin scan customers.csv transactions.csv > ../suggested.toml
          standin mask -r ../suggested.toml -k ../walk.key -o ../masked-by-scan customers.csv transactions.csv
          standin mask -r rules.toml -k ../walk.key -o ../masked customers.csv transactions.csv
          standin check -r rules.toml customers.csv ../masked/customers.csv
          standin check -r rules.toml transactions.csv ../masked/transactions.csv
          # Masking again into the same folder has to refuse, and leave the files alone.
          before=$(cat ../masked/customers.csv)
          if standin mask -r rules.toml -k ../walk.key -o ../masked customers.csv; then exit 1; fi
          [ "$before" = "$(cat ../masked/customers.csv)" ]
          # And the unmasked file has to fail the check.
          if standin check -r rules.toml customers.csv customers.csv; then exit 1; fi
      - name: Uninstall
        run: |
          python -m pipx uninstall standin
          hash -r
          if command -v standin; then exit 1; fi
