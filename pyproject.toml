[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "standin"
dynamic = ["version"]
description = "Masks personal data in CSV extracts with keyed stand-ins of the same shape, so the masked files still join."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Thisul Deven" }]

[project.scripts]
standin = "standin.cli:main"

[tool.setuptools]
packages = ["standin"]

[tool.setuptools.dynamic]
version = { attr = "standin.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
